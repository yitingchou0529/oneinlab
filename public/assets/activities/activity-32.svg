<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="60%" stop-color="#F2ECE1" />
      <stop offset="100%" stop-color="#E5DDD0" />
    </linearGradient>

    <!-- 牆面與地面漸層 -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFEAE1" />
      <stop offset="100%" stop-color="#E2DACD" />
    </linearGradient>

    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EB" />
      <stop offset="100%" stop-color="#EAE3D6" />
    </linearGradient>

    <!-- 大畫紙漸層 -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FAF9F5" />
      <stop offset="100%" stop-color="#F4F1EA" />
    </linearGradient>

    <!-- 陰影濾鏡 -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="8" dy="16" stdDeviation="18" flood-color="#4A4135" flood-opacity="0.14" />
    </filter>

    <filter id="paperShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="4" dy="10" stdDeviation="12" flood-color="#554B3E" flood-opacity="0.12" />
    </filter>

    <filter id="charShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#4A4135" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. 背景與空間透視 (室內溫暖氛圍) -->
  <rect width="1600" height="1000" fill="url(#bgGrad)" />

  <!-- 牆面與踢腳線 -->
  <polygon points="0,0 1600,0 1600,260 0,340" fill="url(#wallGrad)" />
  <line x1="0" y1="340" x2="1600" y2="260" stroke="#C8BFB0" stroke-width="6" />
  <polygon points="0,340 1600,260 1600,274 0,354" fill="#D7CFC2" />

  <!-- 背景窗戶與溫暖採光 -->
  <g opacity="0.85">
    <rect x="1180" y="50" width="300" height="180" rx="6" fill="#F8FBF8" stroke="#8E8578" stroke-width="4" />
    <line x1="1330" y1="50" x2="1330" y2="230" stroke="#8E8578" stroke-width="3" />
    <line x1="1180" y1="140" x2="1480" y2="140" stroke="#8E8578" stroke-width="3" />
    <!-- 窗外綠植葉片 -->
    <path d="M1230,190 C1250,150 1280,140 1310,160 C1290,185 1260,200 1230,190 Z" fill="#9FB898" opacity="0.85" />
    <path d="M1360,180 C1380,135 1420,130 1440,155 C1420,180 1385,190 1360,180 Z" fill="#88A581" opacity="0.8" />
    <path d="M1280,120 C1305,90 1340,95 1350,120 C1325,130 1295,135 1280,120 Z" fill="#ADC3A7" opacity="0.8" />
  </g>

  <!-- 牆上貼的便條紙與圖畫 -->
  <g opacity="0.9">
    <polygon points="180,90 280,80 275,180 175,190" fill="#FFF9E6" stroke="#9A9082" stroke-width="2" />
    <rect x="215" y="75" width="25" height="12" fill="#D08C51" opacity="0.75" />
    <!-- 便條圖形 (心臟與線條示意) -->
    <path d="M210,130 C210,115 230,115 230,130 C230,145 210,155 210,165 C210,155 190,145 190,130 C190,115 210,115 210,130" fill="none" stroke="#E07A5F" stroke-width="2.5" />
    <line x1="200" y1="172" x2="250" y2="172" stroke="#B8AFA2" stroke-width="2" />

    <polygon points="320,110 440,105 435,220 315,225" fill="#FAF5ED" stroke="#9A9082" stroke-width="2" />
    <rect x="365" y="100" width="30" height="14" fill="#6A8D73" opacity="0.7" />
    <!-- 抽象人體簡筆圖示 -->
    <circle cx="375" cy="140" r="10" fill="none" stroke="#5A5245" stroke-width="2" />
    <line x1="375" y1="150" x2="375" y2="185" stroke="#5A5245" stroke-width="2" />
    <line x1="355" y1="165" x2="395" y2="165" stroke="#5A5245" stroke-width="2" />
    <line x1="375" y1="185" x2="360" y2="210" stroke="#5A5245" stroke-width="2" />
    <line x1="375" y1="185" x2="390" y2="210" stroke="#5A5245" stroke-width="2" />
  </g>

  <!-- 地面網格磁磚/木紋細節 (透視線) -->
  <g stroke="#D8D0C3" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="520" x2="1600" y2="440" />
    <line x1="0" y1="720" x2="1600" y2="640" />
    <line x1="0" y1="940" x2="1600" y2="860" />
    <line x1="250" y1="330" x2="50" y2="1000" />
    <line x1="550" y1="315" x2="380" y2="1000" />
    <line x1="850" y1="300" x2="720" y2="1000" />
    <line x1="1150" y1="285" x2="1080" y2="1000" />
    <line x1="1450" y1="270" x2="1420" y2="1000" />
  </g>

  <!-- 2. 地板上鋪設的等身巨大海報紙 (身體地圖創作紙) -->
  <g filter="url(#paperShadow)">
    <polygon points="340,360 1340,310 1390,880 290,920" fill="url(#paperGrad)" stroke="#C5BCAE" stroke-width="3" />
    <!-- 四角固定的紙膠帶 (Masking Tape) -->
    <polygon points="315,350 355,340 370,380 330,390" fill="#E8C99B" opacity="0.85" />
    <polygon points="1315,300 1355,295 1365,335 1325,340" fill="#E8C99B" opacity="0.85" />
    <polygon points="1360,855 1400,850 1410,890 1370,895" fill="#E8C99B" opacity="0.85" />
    <polygon points="275,895 315,890 325,930 285,935" fill="#E8C99B" opacity="0.85" />
  </g>

  <!-- 3. 大海報紙上正在描繪的「身體輪廓地圖」線條 (Body Map Outline) -->
  <g>
    <!-- 已描繪完成的人體外框輪廓 (藍灰墨色/手繪感線條) -->
    <path d="
      M 740,430
      C 725,410 755,385 790,385
      C 825,385 855,410 840,430
      C 850,450 875,465 895,480
      C 930,505 975,540 1020,590
      C 1035,605 1030,620 1015,625
      C 1000,630 985,615 970,600
      C 940,570 910,545 885,535
      C 885,565 880,630 875,700
      C 870,740 890,790 920,845
      C 928,860 915,875 898,875
      C 880,875 870,855 860,825
      C 845,785 830,750 815,720
      C 800,750 785,785 770,825
      C 760,855 750,875 732,875
      C 715,875 702,860 710,845
      C 740,790 760,740 755,700
      C 750,630 745,565 745,535
      C 720,545 690,570 660,600
      C 645,615 630,630 615,625
      C 600,620 595,605 610,590
      C 655,540 700,505 735,480
      C 755,465 780,450 740,430 Z
    " fill="none" stroke="#2F3E46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.88" />

    <!-- 身體地圖上的彩色自我覺察/情緒註記 (彩色便條與小塗鴉) -->
    <!-- 心臟胸口處：溫暖的橘紅光暈與愛心 -->
    <circle cx="810" cy="530" r="28" fill="#F4A261" opacity="0.25" />
    <path d="M810,520 C810,510 825,510 825,520 C825,532 810,542 810,548 C810,542 795,532 795,520 C795,510 810,510 810,520" fill="#E76F51" opacity="0.8" />

    <!-- 腹部太陽神經叢：活力明亮的黃色小太陽/暖星 -->
    <circle cx="810" cy="610" r="12" fill="#E9C46A" opacity="0.8" />
    <line x1="810" y1="592" x2="810" y2="596" stroke="#E76F51" stroke-width="2" />
    <line x1="810" y1="624" x2="810" y2="628" stroke="#E76F51" stroke-width="2" />
    <line x1="792" y1="610" x2="796" y2="610" stroke="#E76F51" stroke-width="2" />
    <line x1="824" y1="610" x2="828" y2="610" stroke="#E76F51" stroke-width="2" />

    <!-- 身體各處留言的小便條紙 (便利貼支持) -->
    <polygon points="620,490 680,485 675,540 615,545" fill="#E8F0EA" stroke="#688A6F" stroke-width="1.5" />
    <line x1="625" y1="505" x2="665" y2="502" stroke="#688A6F" stroke-width="2" stroke-linecap="round" />
    <line x1="625" y1="518" x2="655" y2="515" stroke="#688A6F" stroke-width="2" stroke-linecap="round" />

    <polygon points="940,640 1000,635 995,690 935,695" fill="#FFF3CD" stroke="#CBB46A" stroke-width="1.5" />
    <line x1="945" y1="655" x2="985" y2="652" stroke="#9E8532" stroke-width="2" stroke-linecap="round" />
    <line x1="945" y1="668" x2="975" y2="665" stroke="#9E8532" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 4. 平躺在紙上的主角 (放鬆、伸展、平靜的身體) -->
  <g filter="url(#charShadow)">
    <!-- 頭部與枕著的抱枕 -->
    <rect x="735" y="380" width="110" height="70" rx="20" fill="#EAE2D5" stroke="#4A4135" stroke-width="3.5" />
    <!-- 臉與安詳表情 -->
    <circle cx="790" cy="415" r="32" fill="#FCEFE3" stroke="#3A3228" stroke-width="3.5" />
    <!-- 柔順微捲黑髮 -->
    <path d="M760,405 C755,390 770,380 790,380 C815,380 825,392 822,408 C815,400 805,400 795,405 C785,398 775,400 760,405 Z" fill="#3D372E" />
    <!-- 閉眼微笑表情 (平靜覺察) -->
    <path d="M775,418 C780,423 786,423 790,418" fill="none" stroke="#4A4135" stroke-width="2.5" stroke-linecap="round" />
    <path d="M800,418 C805,423 811,423 815,418" fill="none" stroke="#4A4135" stroke-width="2.5" stroke-linecap="round" />
    <path d="M788,432 C793,436 799,436 803,432" fill="none" stroke="#C46B55" stroke-width="2.5" stroke-linecap="round" />

    <!-- 身體上衣 (簡約舒適的墨綠/大地色棉T) -->
    <path d="
      M 760,447
      L 820,447
      L 855,480
      L 895,525
      L 870,545
      L 840,510
      L 842,610
      L 738,610
      L 740,510
      L 710,545
      L 685,525
      L 725,480 Z
    " fill="#607274" stroke="#2B3638" stroke-width="4" stroke-linejoin="round" />

    <!-- 左手臂自然放在紙上，掌心向上 -->
    <path d="M 685,525 L 640,580 C 632,590 642,605 655,600 L 710,545" fill="#FCEFE3" stroke="#3A3228" stroke-width="3.5" />
    
    <!-- 右手臂正被同伴用筆描繪中 -->
    <path d="M 870,545 L 925,600 C 938,605 948,590 940,580 L 895,525" fill="#FCEFE3" stroke="#3A3228" stroke-width="3.5" />

    <!-- 長褲 (舒適淺灰褐色) -->
    <path d="
      M 738,610
      L 842,610
      L 850,740
      L 870,810
      L 825,815
      L 798,670
      L 755,815
      L 710,810
      L 730,740 Z
    " fill="#D2C7B8" stroke="#3A3228" stroke-width="4" stroke-linejoin="round" />

    <!-- 雙腳 (穿著可愛的暖黃襪子) -->
    <rect x="715" y="810" width="35" height="35" rx="10" fill="#E9C46A" stroke="#3A3228" stroke-width="3.5" />
    <rect x="830" y="810" width="35" height="35" rx="10" fill="#E9C46A" stroke="#3A3228" stroke-width="3.5" />
  </g>

  <!-- 5. 跪在身旁細心描繪的夥伴 (專注、陪伴、細膩傾聽與勾勒) -->
  <g filter="url(#charShadow)">
    <!-- 跪姿身影：位於右側 (X: 1000 ~ 1250, Y: 460 ~ 780) -->
    
    <!-- 下半身 (深色休閒長褲與跪姿雙腿) -->
    <path d="
      M 1080,660
      C 1120,640 1190,660 1210,720
      C 1225,760 1200,800 1140,810
      C 1080,815 1040,780 1050,730
      C 1055,700 1065,680 1080,660 Z
    " fill="#3D4A41" stroke="#232D27" stroke-width="4" />
    <!-- 腳掌與鞋子/襪子 -->
    <ellipse cx="1210" cy="795" rx="30" ry="20" fill="#8D7B68" stroke="#3A3228" stroke-width="3.5" />

    <!-- 上身軀幹 (俯身向前，溫暖駝色針織衫/帽T) -->
    <path d="
      M 1040,510
      C 1070,490 1130,510 1150,560
      C 1160,590 1150,640 1130,670
      C 1090,685 1045,660 1025,610
      C 1015,570 1025,530 1040,510 Z
    " fill="#DDB892" stroke="#4A3B2C" stroke-width="4" stroke-linejoin="round" />

    <!-- 頭部與專注的神情 -->
    <!-- 臉部 -->
    <circle cx="1010" cy="455" r="30" fill="#FCEFE3" stroke="#3A3228" stroke-width="3.5" />
    <!-- 俐落有精神的馬尾/短髮 -->
    <path d="
      M 985,445
      C 985,420 1010,415 1030,420
      C 1045,425 1050,440 1045,460
      C 1035,445 1015,440 995,448 Z
    " fill="#2C241E" />
    <!-- 側後方馬尾束髮 -->
    <path d="M 1045,435 C 1070,430 1085,445 1090,465 C 1075,465 1060,455 1045,445 Z" fill="#2C241E" />
    <!-- 專注凝視的側臉眼睛與專注微笑 -->
    <path d="M 995,460 C 998,465 1005,465 1008,460" fill="none" stroke="#3A3228" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 992,473 C 998,477 1004,475 1008,472" fill="none" stroke="#C46B55" stroke-width="2" stroke-linecap="round" />

    <!-- 左手輕輕按壓紙張固定 (貼心舉動) -->
    <path d="M 1040,570 L 1010,630 L 980,670" fill="none" stroke="#DDB892" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="975" cy="675" r="14" fill="#FCEFE3" stroke="#3A3228" stroke-width="3" />

    <!-- 右手臂向前伸出，手持彩色奇異筆正在精確勾勒指尖 -->
    <path d="M 1060,540 L 1020,580 L 950,600" fill="none" stroke="#DDB892" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 右手掌 -->
    <circle cx="945" cy="600" r="13" fill="#FCEFE3" stroke="#3A3228" stroke-width="3" />
    <!-- 手中拿的繪圖專用筆 (青碧色外殼) -->
    <polygon points="930,608 955,585 962,593 937,616" fill="#2A9D8F" stroke="#1D3557" stroke-width="2" />
    <!-- 筆尖落在紙張輪廓上 (X: 928, Y: 610) -->
    <polygon points="926,612 932,606 930,615" fill="#E76F51" />
  </g>

  <!-- 6. 地面散落的創作素材 (畫筆盒、彩色顏料、彩筆筒) -->
  <g filter="url(#softShadow)">
    <!-- 放置在地上的文具托盒 (木質小文具箱) -->
    <polygon points="420,700 560,670 590,750 450,780" fill="#E6CCB2" stroke="#7F5539" stroke-width="3.5" />
    <polygon points="420,700 560,670 560,690 420,720" fill="#DDB892" />
    <!-- 盒子裡露出的彩色麥克筆 -->
    <line x1="450" y1="715" x2="490" y2="695" stroke="#E63946" stroke-width="8" stroke-linecap="round" />
    <line x1="470" y1="725" x2="510" y2="705" stroke="#457B9D" stroke-width="8" stroke-linecap="round" />
    <line x1="490" y1="735" x2="530" y2="715" stroke="#2A9D8F" stroke-width="8" stroke-linecap="round" />
    <line x1="510" y1="745" x2="550" y2="725" stroke="#F4A261" stroke-width="8" stroke-linecap="round" />

    <!-- 掉在紙邊的一支筆與開蓋 -->
    <line x1="390" y1="640" x2="435" y2="620" stroke="#264653" stroke-width="7" stroke-linecap="round" />
    <ellipse cx="442" cy="617" rx="4" ry="4" fill="#E76F51" />
  </g>

  <!-- 7. 右上角藝術品味標章 / 輕柔氛圍光澤 -->
  <g opacity="0.4">
    <circle cx="1400" cy="150" r="160" fill="#FFF" filter="url(#softShadow)" opacity="0.2" />
  </g>
</svg>
